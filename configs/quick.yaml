# Small smoke-test config: same as default.yaml except the keys below.
base: default.yaml
subsample_frac: 0.1         # 10% of each large class ...
subsample_keep_below: 2000  # ... but classes with fewer rows than this are kept whole
attack_types: [DoS, Shellcode]
bootstrap:
  n_resamples: 100
  ci: 0.95
